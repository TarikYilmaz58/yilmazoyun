<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yılmaz Oyun Merkezi</title>
    <style>
        body {
            background-color: #0f1016;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            color: #ff3366;
            margin-bottom: 10px;
            font-size: 2.8rem;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 51, 102, 0.5);
        }
        p {
            color: #8b9bb4;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }
        .menu-container {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .game-btn {
            background: linear-gradient(135deg, #1f2233, #151824);
            color: white;
            border: 2px solid #ff3366;
            padding: 25px 40px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            min-width: 180px;
        }
        .game-btn span {
            font-size: 0.85rem;
            color: #00ffcc;
            font-weight: normal;
        }
        .game-btn:hover {
            transform: translateY(-5px);
            border-color: #00ffcc;
            box-shadow: 0 8px 25px rgba(0, 255, 204, 0.3);
            background: linear-gradient(135deg, #25293d, #1a1d2e);
        }
    </style>
</head>
<body>

    <h1>OYUN MERKEZİ</h1>
    <p>Oynamak istediğin oyunu seç ve başla!</p>
    
    <div class="menu-container">
        <a href="neon-drift.html" class="game-btn">
            🚗 Neon Drift
            <span>Şerit Değiştirme Oyunu</span>
        </a>
        <a href="ninja-saldırısı.html" class="game-btn">
            🥷 Ninja Strike
            <span>Dart / Hedef Oyunu</span>
        </a>
    </div>

</body>
</html>
