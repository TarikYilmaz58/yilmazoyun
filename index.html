<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yılmaz Games - Arcade Hub</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050b14;
            color: #00ffcc;
            font-family: 'Consolas', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        h1 {
            font-size: 36px;
            margin-bottom: 10px;
            text-shadow: 0 0 15px #00ffcc, 0 0 30px #00ffcc;
        }
        p {
            color: #ff9900;
            margin-bottom: 30px;
            text-shadow: 0 0 5px #ff9900;
        }
        .game-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 300px;
        }
        .game-btn {
            background: transparent;
            border: 2px solid #ff0055;
            color: #ffffff;
            padding: 15px;
            font-size: 18px;
            font-family: 'Consolas', monospace;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 0 10px #ff0055;
            transition: 0.3s;
        }
        .game-btn:hover {
            background-color: #ff0055;
            box-shadow: 0 0 20px #ff0055, 0 0 40px #ff0055;
            color: #050b14;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>YILMAZ GAMES HUB</h1>
    <p>Oynamak istediğin oyunu seç ve maceraya başla!</p>

    <div class="game-list">
        <!-- İlk oyunumuz -->
        <a href="neon-drift.html" class="game-btn">🚗 Neon Drift</a>
        <!-- Buraya ileride yeni oyunlar ekleyeceğiz -->
        <a href="#" class="game-btn" style="opacity: 0.5; border-color: #555; box-shadow: none;">🚀 Yakında Yeni Oyun</a>
    </div>

</body>
</html>
