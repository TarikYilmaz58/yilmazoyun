<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yılmaz Games - Neon Drift</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050b14;
            color: #00ffcc;
            font-family: 'Consolas', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        h1 {
            margin: 5px;
            text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc;
            font-size: 18px;
        }
        canvas {
            border: 3px solid #ff0055;
            box-shadow: 0 0 20px #ff0055, inset 0 0 20px #ff0055;
            background: #050b14;
            max-width: 100%;
            height: auto;
        }
        .controls {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        .ctrl-btn {
            background: transparent;
            border: 2px solid #00ffcc;
            color: #00ffcc;
            font-size: 24px;
            padding: 10px 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px #00ffcc;
            cursor: pointer;
            font-family: 'Consolas', monospace;
        }
        .ctrl-btn:active {
            background-color: #00ffcc;
            color: #050b14;
        }
        .back-btn {
            margin-top: 8px;
            color: #ff9900;
            text-decoration: none;
            border: 1px solid #ff9900;
            padding: 4px 12px;
            border-radius: 5px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <h1>YILMAZ GAMES - NEON DRIFT</h1>
    <canvas id="gameCanvas" width="800" height="420"></canvas>
    
    <div class="controls">
        <button class="ctrl-btn" onclick="moveLeft()">◀</button>
        <button class="ctrl-btn" onclick="moveRight()">▶</button>
    </div>

    <a href="./index.html" class="back-btn">← Ana Menü</a>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let carWidth = 45;
        let carHeight = 80;
        let lanes = [175, 275, 375, 475, 575];
        let carX = lanes[2];
        let carY = 320;

        let obstacles = [];
        let score = 0;
        let isGameOver = false;

        function moveLeft() {
            if (isGameOver) {
                resetGame();
                return;
            }
            let idx = lanes.indexOf(carX);
            if (idx > 0) carX = lanes[idx - 1];
        }

        function moveRight() {
            if (isGameOver) {
                resetGame();
                return;
            }
            let idx = lanes.indexOf(carX);
            if (idx < lanes.length - 1) carX = lanes[idx + 1];
        }

        window.addEventListener("keydown", (e) => {
            if (!isGameOver) {
                if (e.code === "ArrowLeft" || e.code === "KeyA") moveLeft();
                if (e.code === "ArrowRight" || e.code === "KeyD") moveRight();
            } else {
                if (e.code === "KeyR" || e.code === "Space") resetGame();
            }
        });

        canvas.addEventListener("touchstart", (e) => {
            let touchX = e.touches[0].clientX;
            if (isGameOver) {
                resetGame();
                return;
            }
            if (touchX < window.innerWidth / 2) {
                moveLeft();
            } else {
                moveRight();
            }
            e.preventDefault();
        }, { passive: false });

        function spawnObstacle() {
            if (isGameOver) return;
            let laneX = lanes[Math.floor(Math.random() * lanes.length)];
            obstacles.push({ x: laneX, y: -100, width: carWidth, height: carHeight, speed: 6 });
        }

        setInterval(spawnObstacle, 900);

        function resetGame() {
            obstacles = [];
            score = 0;
            carX = lanes[2];
            isGameOver = false;
        }

        function update() {
            if (isGameOver) return;

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].y += obstacles[i].speed;

                if (
                    carX < obstacles[i].x + obstacles[i].width &&
                    carX + carWidth > obstacles[i].x &&
                    carY < obstacles[i].y + obstacles[i].height &&
                    carY + carHeight > obstacles[i].y
                ) {
                    isGameOver = true;
                }

                if (obstacles[i].y > canvas.height) {
                    obstacles.splice(i, 1);
                    score += 10;
                }
            }
        }

        function draw() {
            ctx.fillStyle = "#050b14";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = "#ff0055";
            ctx.lineWidth = 4;
            ctx.shadowBlur = 12;
            ctx.shadowColor = "#ff0055";
            
            ctx.beginPath();
            ctx.moveTo(130, 0); ctx.lineTo(130, canvas.height);
            ctx.moveTo(670, 0); ctx.lineTo(670, canvas.height);
            ctx.stroke();

            ctx.fillStyle = "#00ffcc";
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#00ffcc";
            ctx.fillRect(carX, carY, carWidth, carHeight);

            ctx.fillStyle = "#050b14";
            ctx.fillRect(carX + 8, carY + 15, carWidth - 16, 20);

            ctx.fillStyle = "#ff9900";
            ctx.shadowColor = "#ff9900";
            for (let obs of obstacles) {
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            }

            ctx.shadowBlur = 0;
            ctx.fillStyle = "#ffffff";
            ctx.font = "20px Consolas";
            ctx.fillText("SKOR: " + score, 20, 30);

            if (isGameOver) {
                ctx.fillStyle = "rgba(5, 11, 20, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ff0055";
                ctx.shadowBlur = 20;
                ctx.shadowColor = "#ff0055";
                ctx.font = "26px Consolas";
                ctx.fillText("SİSTEM ÇÖKTÜ (GAME OVER)", 150, 160);

                ctx.fillStyle = "#00ffcc";
                ctx.font = "16px Consolas";
                ctx.fillText("Yeniden başlamak için dokun veya 'R' bas", 180, 210);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
